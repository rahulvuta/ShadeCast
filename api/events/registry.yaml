# ShadeCast Time Machine — historical event registry
# Expected verdicts are what the product claims for the real-world event.
# Engine actuals come from replaying Open-Meteo archive + FIRMS fixtures
# through the unmodified environmental-load path.

events:
  - id: nyc_2023_06
    label: Canadian wildfire smoke — NYC (June 2023)
    lat: 40.71
    lon: -74.01
    start_date: "2023-06-07"
    end_date: "2023-06-08"
    default_hour_offset: 14
    workload: moderate
    acclimatized: false
    profile: general
    expected_verdicts: [STOP, RESTRICT]
    expected_concordance: MODEL_LEADS
    description: >
      In early June 2023, Canadian wildfire smoke blanketed the US Northeast.
      New York City ground monitors reported AQI above 400 on some hours —
      among the worst air-quality days on record for the city. ShadeCast
      replays Open-Meteo archive weather and CAMS air-quality for these
      coordinates; FIRMS NRT does not retain 2023 detections, so local fire
      rows are empty (MODEL_LEADS). Source:
      https://www.nytimes.com/2023/06/07/nyregion/nyc-air-quality-smoke.html
    source_url: https://www.nytimes.com/2023/06/07/nyregion/nyc-air-quality-smoke.html

