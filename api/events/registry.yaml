# ShadeCast Time Machine — historical event registry
# Expected verdicts are what the product claims for the real-world event.
# Engine actuals come from replaying Open-Meteo archive + FIRMS fixtures
# through the unmodified environmental-load path.

events:
  - id: quebec_2023_06
    label: Quebec wildfires — Lebel-sur-Quévillon (June 2023)
    lat: 49.05
    lon: -76.98
    start_date: "2023-06-07"
    end_date: "2023-06-08"
    default_hour_offset: 14
    workload: moderate
    acclimatized: false
    profile: general
    expected_verdicts: [STOP, RESTRICT]
    expected_concordance: AGREE
    description: >
      In June 2023, Quebec's record wildfire season forced evacuations across
      northern communities including Lebel-sur-Quévillon. ShadeCast replays
      Open-Meteo archive weather and CAMS air-quality at the town, plus a
      committed FIRMS archive fixture of nearby high-FRP detections (NRT does
      not retain 2023). Source:
      https://www.cbc.ca/news/canada/montreal/quebec-wildfires-2023-1.6870123
    source_url: https://www.cbc.ca/news/canada/montreal/quebec-wildfires-2023-1.6870123

