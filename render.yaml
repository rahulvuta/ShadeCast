# Render Blueprint — ShadeCast
# Deploy: connect this repo in the Render dashboard → New → Blueprint
# You must set secret env vars (DATABASE_URL is auto-wired from shadecast-db).

databases:
  - name: shadecast-db
    plan: free

services:
  - type: web
    name: shadecast-api
    runtime: python
    plan: free
    rootDir: .
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: alembic upgrade head && uvicorn api.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /healthz
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shadecast-db
          property: connectionString
      - key: NASA_FIRMS_MAP_API_KEY
        sync: false
      - key: NASA_API_KEY
        sync: false
      - key: FEATHERLESS_API_KEY
        sync: false
      - key: FEATHERLESS_MODEL_ID
        value: zai-org/GLM-5.2
      - key: FEATHERLESS_BASE_URL
        value: https://api.featherless.ai/v1
      - key: DEMO_MODE
        value: "0"
      - key: STALE_AFTER_MINUTES
        value: "60"
      - key: CORS_ORIGINS
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"

  - type: web
    name: shadecast-web
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE
        sync: false

  - type: cron
    name: shadecast-ingest
    runtime: python
    plan: starter
    rootDir: .
    schedule: "*/20 * * * *"
    buildCommand: pip install --upgrade pip && pip install -r requirements.txt
    startCommand: python -m ingest.job
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: shadecast-db
          property: connectionString
      - key: NASA_FIRMS_MAP_API_KEY
        sync: false
      - key: NASA_API_KEY
        sync: false
      - key: PYTHON_VERSION
        value: "3.12.0"
